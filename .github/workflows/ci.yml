name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: Lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: PYTHONPATH=. pytest -q

  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t bosch-api:ci .

      - name: Build dashboard image
        run: docker build -f Dockerfile.dashboard -t bosch-dashboard:ci .

  leaderboard-schema:
    name: Validate results/leaderboard.json
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Schema + row-count check
        run: |
          python -c "
          import json

          d = json.load(open('results/leaderboard.json'))

          required_top = {'schema_version', 'generated', 'source_of_truth', 'program_status', 'notes', 'experiments'}
          missing_top = required_top - d.keys()
          assert not missing_top, f'leaderboard.json missing top-level keys: {missing_top}'

          experiments = d['experiments']
          assert len(experiments) == 9, f'expected 9 experiments, got {len(experiments)}'

          required_row = {
              'experiment_id', 'kdr', 'kdr_file', 'date', 'mechanism', 'feature_count',
              'oof_mcc', 'oof_status', 'threshold', 'public_mcc', 'private_mcc',
              'data_fingerprint', 'git_tag', 'hypothesis', 'hypothesis_result', 'notes',
          }
          for row in experiments:
              missing_row = required_row - row.keys()
              assert not missing_row, f\"{row['experiment_id']} missing keys: {missing_row}\"

          print(f'OK: results/leaderboard.json has {len(experiments)} experiments, schema valid.')
          "
